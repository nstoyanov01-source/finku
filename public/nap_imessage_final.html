<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>НАП iMessage — Finku</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0c;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tdot{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:bounce 1.2s infinite}
.tdot:nth-child(2){animation-delay:.2s}
.tdot:nth-child(3){animation-delay:.4s}
.bl{background:#e5e5ea;color:#000;padding:8px 12px;border-radius:18px;border-bottom-left-radius:4px;font-size:14px;max-width:75%;line-height:1.4;animation:fadeIn 0.2s ease;word-break:break-word}
.br{background:#007AFF;color:#fff;padding:8px 12px;border-radius:18px;border-bottom-right-radius:4px;font-size:14px;max-width:75%;line-height:1.4;animation:fadeIn 0.2s ease;word-break:break-word}
#msgs{height:390px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;background:#fff;position:relative}
#msgs::-webkit-scrollbar{display:none}
#cta-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#0e0e0c 60%,rgba(14,14,12,0) 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 16px 24px;opacity:0;transition:opacity 0.8s ease;pointer-events:none}
#cta-overlay.visible{opacity:1;pointer-events:all}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.nav-btn{background:#1c1c1e;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer}
.nav-btn:disabled{opacity:0.3;cursor:default}
.replay-btn{background:#c8f03a;color:#0e0e0c;border:none;padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:700}
.label{font-size:13px;color:#666;min-width:90px;text-align:center}
</style>
</head>
<body>

<div class="controls">
  <button class="nav-btn" id="prevBtn" onclick="changeScenario(-1)" disabled>← Назад</button>
  <span class="label" id="scenarioLabel">Сценарий 1/5</span>
  <button class="nav-btn" id="nextBtn" onclick="changeScenario(1)">Напред →</button>
  <button class="replay-btn" onclick="replay()">↺ Replay</button>
</div>

<div style="width:300px;background:#1c1c1e;border-radius:44px;padding:10px;border:1.5px solid #3a3a3c;">
  <div style="background:#000;border-radius:34px;overflow:hidden;">
    <div style="background:#000;display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:12px;color:#fff;font-weight:600;">
      <span>9:41</span>
      <div style="width:90px;height:8px;background:#1c1c1e;border-radius:8px;"></div>
      <span style="font-size:11px;opacity:0.9;">●●● 🔋</span>
    </div>
    <div style="background:#f2f2f7;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:0.5px solid #d1d1d6;">
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1a6eb5,#5856D6);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;">Н</div>
      <span style="font-size:15px;font-weight:600;color:#000;">НАП</span>
      <span id="subLabel" style="font-size:11px;color:#8e8e93;">Национална агенция за приходите</span>
    </div>
    <div style="position:relative">
      <div id="msgs"></div>
      <div id="cta-overlay">
        <p style="color:#f0ede4;font-size:15px;font-weight:600;text-align:center;margin:0 0 6px;line-height:1.4;">Регистриран ли си?<br/><span style="color:#aaa;font-size:13px;font-weight:400;">НАП вече знае.</span></p>
        <p style="color:#888;font-size:11px;text-align:center;margin:0 0 14px;">Разбери колко дължаш преди те.</p>
        <div style="background:#c8f03a;border-radius:20px;padding:10px 28px;font-size:14px;font-weight:700;color:#0e0e0c;">finku.eu</div>
      </div>
    </div>
    <div style="background:#f2f2f7;padding:8px 10px;display:flex;align-items:center;border-top:0.5px solid #d1d1d6;">
      <div style="flex:1;background:#fff;border-radius:18px;padding:7px 12px;font-size:13px;color:#8e8e93;border:0.5px solid #d1d1d6;">iMessage</div>
    </div>
    <div style="background:#000;padding:8px;display:flex;justify-content:center;">
      <div style="width:110px;height:4px;background:#555;border-radius:2px;"></div>
    </div>
  </div>
</div>

<script>
const scenarios=[
  {title:'YouTuber',msgs:[
    {s:'l',t:'Здрасти',d:800},{s:'r',t:'Кой е?',d:600},
    {s:'l',t:'НАП. Гледахме канала ти.',d:1000},{s:'r',t:'Приятно',d:500},
    {s:'l',t:'47,000 абонати. Google ти плаща ли?',d:1200},{s:'r',t:'Не много',d:600},
    {s:'l',t:'1,840 лв миналия месец не е "не много".',d:1400},{s:'r',t:'Това беше от приятел',d:800},
    {s:'l',t:'Приятелят ти е Google LLC?',d:1000},{s:'r',t:'...',d:400},
    {s:'l',t:'Регистриран ли си като самоосигуряващ се?',d:1200},
  ]},
  {title:'Fiverr дизайнер',msgs:[
    {s:'l',t:'Здравей',d:800},{s:'r',t:'Да?',d:500},
    {s:'l',t:'НАП. Видяхме Fiverr профила ти.',d:1100},{s:'r',t:'Просто хоби е',d:700},
    {s:'l',t:'Хобито ти е спечелило 8,200 лв тази година.',d:1400},{s:'r',t:'Може би',d:500},
    {s:'l',t:'"Може би" не е данъчна декларация.',d:1100},{s:'r',t:'Аз съм студент',d:600},
    {s:'l',t:'Студентите също плащат данъци.',d:1000},{s:'r',t:'Не знаех',d:600},
    {s:'l',t:'Знаем. Колко печелиш на месец?',d:1000},
  ]},
  {title:'Крипто трейдър',msgs:[
    {s:'l',t:'Здрасти',d:800},{s:'r',t:'Кой е?',d:600},
    {s:'l',t:'НАП. Продаде ли Ethereum миналата година?',d:1200},{s:'r',t:'Малко',d:500},
    {s:'l',t:'23,400 лв не е малко.',d:1000},{s:'r',t:'Загубих после',d:700},
    {s:'l',t:'Загубата беше 1,200 лв. Печалбата беше 23,400 лв.',d:1600},{s:'r',t:'Нетно съм на загуба',d:800},
    {s:'l',t:'Не така работи данъчният закон.',d:1100},{s:'r',t:'Сериозно ли',d:600},
    {s:'l',t:'Много. Имаш ли регистрация?',d:1000},
  ]},
  {title:'Инфлуенсър',msgs:[
    {s:'l',t:'Здрасти',d:800},{s:'r',t:'Да?',d:500},
    {s:'l',t:'НАП. Видяхме Instagram поста с #ad от миналата седмица.',d:1500},{s:'r',t:'Беше само едно парче',d:800},
    {s:'l',t:'5 #ad поста тази година. 12,500 лв.',d:1100},{s:'r',t:'Брандовете ме плащат с продукти',d:900},
    {s:'l',t:'iPhone 15 Pro, AirPods и 3 чифта маратонки. Видяхме разопаковането.',d:1700},
    {s:'r',t:'Ти следиш профила ми?',d:800},
    {s:'l',t:'Публичен профил. 🙂 Регистрирана ли си?',d:1100},
  ]},
  {title:'Кеш плащания',msgs:[
    {s:'l',t:'Добър ден',d:800},{s:'r',t:'Здравейте?',d:600},
    {s:'l',t:'НАП. Клиентите ти плащат само в брой?',d:1200},{s:'r',t:'Да, така е по-лесно',d:800},
    {s:'l',t:'За кого?',d:700},{s:'r',t:'...',d:400},
    {s:'l',t:'Имаш ли касов апарат?',d:1000},{s:'r',t:'Планирам да взема',d:700},
    {s:'l',t:'От кога планираш?',d:900},{s:'r',t:'От скоро',d:500},
    {s:'l',t:'Скоро е 2019 според нашите данни.',d:1200},{s:'r',t:'',d:300},
    {s:'l',t:'Можеш ли да минеш в офиса?',d:1000},
  ]}
];

let receivedSound, sentSound;

function initAudio() {
  receivedSound = new Audio('/received.caf');
  sentSound = new Audio('/sent.caf');
  receivedSound.load();
  sentSound.load();
}

function playReceive() {
  if (!receivedSound) return;
  receivedSound.currentTime = 0;
  receivedSound.play().catch(()=>{});
}

function playSend() {
  if (!sentSound) return;
  sentSound.currentTime = 0;
  sentSound.play().catch(()=>{});
}

document.addEventListener('click', initAudio, { once: true });

let current=0,idx=0,timer=null;
const c=document.getElementById('msgs');

function showTyping(s){
  const w=document.createElement('div');
  w.id='typing';
  w.style.cssText=`display:flex;gap:4px;align-items:center;padding:9px 12px;border-radius:18px;align-self:${s==='r'?'flex-end':'flex-start'};${s==='r'?'background:#007AFF;border-bottom-right-radius:4px':'background:#e5e5ea;border-bottom-left-radius:4px'};margin:${s==='r'?'0 0 0 40px':'0 40px 0 0'}`;
  [1,2,3].forEach(()=>{const d=document.createElement('div');d.className='tdot';if(s==='r')d.style.background='rgba(255,255,255,0.7)';w.appendChild(d);});
  c.appendChild(w);c.scrollTop=c.scrollHeight;return w;
}

function showMsg(m){
  if(!m.t)return;
  if(m.s==='l') playReceive(); else playSend();
  const w=document.createElement('div');
  w.style.cssText=`display:flex;justify-content:${m.s==='r'?'flex-end':'flex-start'};padding:0 4px`;
  const b=document.createElement('div');
  b.className=m.s==='r'?'br':'bl';
  b.textContent=m.t;
  w.appendChild(b);c.appendChild(w);c.scrollTop=c.scrollHeight;
}

function showFinalTyping(){
  showTyping('l');
  setTimeout(()=>{document.getElementById('cta-overlay').classList.add('visible');},2800);
}

function next(){
  const msgs=scenarios[current].msgs;
  if(idx>=msgs.length){showFinalTyping();return;}
  const m=msgs[idx];
  const t=showTyping(m.s);
  timer=setTimeout(()=>{
    t.remove();showMsg(m);idx++;
    if(idx<msgs.length)timer=setTimeout(next,600);
    else timer=setTimeout(showFinalTyping,800);
  },m.d);
}

function startScenario(){
  if(timer)clearTimeout(timer);
  c.innerHTML='';idx=0;
  document.getElementById('cta-overlay').classList.remove('visible');
  document.getElementById('scenarioLabel').textContent=`Сценарий ${current+1}/5`;
  document.getElementById('subLabel').textContent=scenarios[current].title;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===scenarios.length-1;
  setTimeout(next,800);
}

function changeScenario(dir){current=Math.max(0,Math.min(scenarios.length-1,current+dir));startScenario();}
function replay(){startScenario();}
startScenario();
</script>
</body>
</html>
